# Example configuration. Every key can also be set as an environment variable:
# LIBRARIAN_<KEY>, nested with "__" (e.g. LIBRARIAN_NOTIFIER__SLACK__BOT_TOKEN).
# Environment variables win over this file.

host: 127.0.0.1
port: 8080
public_url: http://127.0.0.1:8080     # how approvers' browsers reach the secure page
# pages_port: 8081                     # serve the approval pages on their own listener
# pages_host: 127.0.0.1                # (required with approvers.mode: trusted_header)

registry_dir: registry
secrets_backend: file                  # file | aws (Secrets Manager; `aws` extra)
secrets_dir: .librarian/secrets        # file backend: one 0600 file per secret
aws_secrets:
  region: null                         # default AWS config chain
  prefix: ""                           # e.g. "librarian/" → ref jira/readonly = secret librarian/jira/readonly
  cache_seconds: 60
database_url: sqlite+aiosqlite:///.librarian/librarian.db   # or postgresql+asyncpg://... (`postgres` extra)
# audit_file: .librarian/audit.jsonl   # default: JSON lines on stdout
# audit_retention_days: 30            # with a database, events are also kept there for the console's Activity pages

# The `fetch` skill (plain-language requests). Leave unset to run without an LLM.
# model: anthropic:claude-sonnet-5-5   # uses ANTHROPIC_API_KEY
# Or any OpenAI-compatible gateway, e.g. LiteLLM:
# model: claude-sonnet-5-5
# model_base_url: http://litellm:4000/v1
# model_api_key: set-via-LIBRARIAN_MODEL_API_KEY
# model_api: openai                   # gateway API format: openai | anthropic (needed for web search)
max_calls_per_fetch: 8
# A plain-language request stops after this many seconds and returns what it has,
# marked partial. Keep it below your gateway's tool timeout (LiteLLM: 120 s).
fetch_timeout_seconds: 100

rate_limit_per_minute: 60              # per calling agent, per API
request_timeout_seconds: 30
max_response_bytes: 2000000
allow_provisional: true                # serve auto-learned (unreviewed) entries, GET/HEAD only
allow_private_networks: false          # SSRF guard for onboarding + provisional entries
internal_hosts: []                     # e.g. ["*.internal.example.com"]: private addresses allowed for these hosts only
onboarding_enabled: true
credential_wait_seconds: 900           # how long a task waits for an approver

# OpenTelemetry traces + metrics (`otel` extra). Endpoint via OTEL_EXPORTER_OTLP_ENDPOINT.
otel_enabled: false
otel_service_name: librarian

# Calling agents and the secret holding each one's bearer key.
# Empty = open server (local use only).
callers: []
#  - agent: release-notes-agent
#    key_ref: librarian/callers/release-notes-agent
#    apis: ["jira", "github-*"]        # glob patterns; default ["*"]
#    can_onboard: false
#    write_apis: ["jira"]              # may request writes (each needs approval or a grant)
#    owner: ops@example.com            # stands in as requester for autonomous agents

# Who agents act for: off (claims trusted) | optional | required (proof via a signed token).
principals:
  mode: "off"
  header: X-Principal-Token
  issuers: []
#    - issuer: https://acme.okta.com/oauth2/default
#      audience: librarian
#      claim: email

# Writes: who approves, how long approvals stay open, and standing grants.
writes:
  approvers: requester_or_group        # requester | group | requester_or_group
  approval_expire_hours: 24
  rate_limit_per_minute: 10
  announce_auto: false                 # post each automatically approved write to Slack (noisy)
  max_grant_days: null                 # longest "allow similar writes" grant; null: until revoked
  grants: []
#    - agent: triage-bot
#      api: jira
#      operation: addLabel
#      pinned_args: {}
#      max_uses_per_day: 50
#      notify_owner: true

notifier:
  type: log                            # log | slack | webhook
  remind_after_hours: 4
  expire_after_hours: 24
  slack:
    channel: "#api-access-requests"
    # approver_group: S0123ABCD        # Slack user-group ID for @mentions
    # bot_token: set-via-LIBRARIAN_NOTIFIER__SLACK__BOT_TOKEN
  # webhook_url: https://hooks.example.com/librarian

# Propose learned APIs for human review as GitHub pull requests.
publish:
  type: none                           # none | github
  # repo: acme/api-registry
  # base_branch: main
  # directory: registry
  # token: set-via-LIBRARIAN_PUBLISH__TOKEN
  # merge_console_decisions: true      # console/enable-page decisions on verified entries merge at once

approvers:
  mode: token                          # token (local) | trusted_header (behind an auth proxy)
  # user_header: X-Auth-Request-Email
  # groups_header: X-Auth-Request-Groups
  # group: api-approvers
  # console: signed_in                 # the read-only console at /: signed_in | open (laptop) | off

# APIs with no OpenAPI spec (needs `model`): learn from documentation pages, or from the
# model's own knowledge (reads only). Both are unconfirmed until a real call succeeds.
# fallback_model: claude-sonnet-5-5   # tried once when the model fails or declines a request
learning:
  # model: claude-opus-5-5             # for learning only (once per API); default: `model`
  docs_max_pages: 8
  find_docs: true                      # look in the usual places when only base_url is given
  search:
    provider: "off"                    # off | model | searxng | brave
    # url: https://searx.internal       # searxng
    # api_key: set-via-LIBRARIAN_LEARNING__SEARCH__API_KEY   # brave
    allow_third_party: false           # only the API's own domain and known docs hosts
  model_knowledge: true

# Re-read each API's spec or docs this often and handle changes (0 = never).
drift:
  recheck_hours: 24
