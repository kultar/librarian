name: release

# Runs on a version tag (v1.2.3), or manually for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - id: version
        name: Tag must match the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match pyproject version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create (or update) the GitHub release with the built distributions
        env:
          GH_TOKEN: ${{ github.token }}
        # Create first, then upload: re-runnable, and avoids gh creating a second
        # release while uploading assets in the same call.
        run: |
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "librarian ${TAG}" --generate-notes --verify-tag
          fi
          gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    # The Helm chart as an OCI artifact: helm install librarian oci://ghcr.io/<owner>/charts/librarian
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@v4
      - name: Chart version and appVersion must match the release
        run: |
          chart="$(awk '/^version:/ {print $2}' deploy/helm/librarian/Chart.yaml)"
          app="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' deploy/helm/librarian/Chart.yaml)"
          if [ "${chart}" != "${VERSION}" ] || [ "${app}" != "${VERSION}" ]; then
            echo "::error::Chart.yaml version ${chart} / appVersion ${app} do not match ${VERSION}"
            exit 1
          fi
      - run: helm lint deploy/helm/librarian
      - run: helm package deploy/helm/librarian --destination .
      - name: Push the chart to ghcr.io
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "librarian-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  pypi:
    # Enable once PyPI trusted publishing is configured for this repo (see RELEASING.md):
    # repository variable PYPI_PUBLISH = true.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
