name: release

# Runs on a version tag (v1.2.3), or manually for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - id: version
        name: Tag must match the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match pyproject version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create (or update) the GitHub release with the built distributions
        env:
          GH_TOKEN: ${{ github.token }}
        # Create first, then upload: re-runnable, and avoids gh creating a second
        # release while uploading assets in the same call.
        run: |
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "librarian ${TAG}" --generate-notes --verify-tag
          fi
          gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    # The Helm chart as an OCI artifact: helm install librarian oci://ghcr.io/<owner>/charts/librarian
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@v4
      - name: Chart version and appVersion must match the release
        run: |
          chart="$(awk '/^version:/ {print $2}' deploy/helm/librarian/Chart.yaml)"
          app="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' deploy/helm/librarian/Chart.yaml)"
          if [ "${chart}" != "${VERSION}" ] || [ "${app}" != "${VERSION}" ]; then
            echo "::error::Chart.yaml version ${chart} / appVersion ${app} do not match ${VERSION}"
            exit 1
          fi
      - run: helm lint deploy/helm/librarian
      - run: helm package deploy/helm/librarian --destination .
      - name: Push the chart to ghcr.io
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "librarian-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  mcp-registry:
    # librarian's MCP endpoint in the MCP Registry (registry.modelcontextprotocol.io), as
    # server.json describes it. The registry lists a package only if the package says it is
    # this server (the README on PyPI, a label on the image), so this runs after both.
    needs: [build, image, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the registry takes GitHub's word that this is this repository
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: server.json must describe this release
        run: |
          python3 - <<'EOF'
          import json, os, sys
          server = json.load(open("server.json"))
          named = {server["version"]} | {
              package.get("version") or package["identifier"].rsplit(":", 1)[-1]
              for package in server["packages"]
          }
          if named != {os.environ["VERSION"]}:
              sys.exit(f"::error::server.json names {sorted(named)}, the release is {os.environ['VERSION']}")
          EOF
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish (the package index can need a moment to show the new version)
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "attempt ${attempt} failed; waiting"
            sleep 30
          done
          exit 1

  pypi:
    # Enable once PyPI trusted publishing is configured for this repo (see RELEASING.md):
    # repository variable PYPI_PUBLISH = true.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
