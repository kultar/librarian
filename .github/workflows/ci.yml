name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Validate example registry
        run: uv run librarian registry validate
        env:
          LIBRARIAN_REGISTRY_DIR: examples/registry

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/librarian
      - name: Render with every option enabled
        run: >
          helm template t deploy/helm/librarian
          --set publicUrl=https://librarian.example.com
          --set oauth2Proxy.enabled=true,oauth2Proxy.existingSecret=s,oauth2Proxy.approverGroup=g
          --set registry.gitSync.enabled=true,registry.gitSync.repo=https://example.com/r.git
          --set ingress.a2a.enabled=true,ingress.pages.enabled=true,otel.enabled=true
          > /dev/null
      - name: Numeric GitHub App ids from a values file render whole
        run: |
          out="$(helm template t deploy/helm/librarian -f deploy/helm/librarian/ci/github-app-values.yaml)"
          echo "$out" | grep -q -- "--github-app-installation-id=987654321," || { echo "$out" | grep installation-id; exit 1; }
          echo "$out" | grep -q -- "--github-app-application-id=1234567," || { echo "$out" | grep application-id; exit 1; }
          echo "$out" | grep -q 'app_id: "1234567"' || { echo "$out" | grep app_id; exit 1; }

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t librarian:ci .
