name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite takes a few minutes. A test that waits for ever on something that never
    # comes should fail the run, not hold a runner for hours.
    timeout-minutes: 20
    services:
      # For the tests about what is kept: Postgres is stricter than SQLite about what text
      # and JSON may hold, and really runs two replicas' queries at once
      # (tests/test_hostile_api.py, tests/test_plans.py).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: librarian
          POSTGRES_PASSWORD: librarian
          POSTGRES_DB: hostile
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U librarian -d hostile"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
        env:
          LIBRARIAN_TEST_POSTGRES_URL: postgresql+asyncpg://librarian:librarian@localhost:5432/hostile
      - name: Validate example registry
        run: uv run librarian registry validate
        env:
          LIBRARIAN_REGISTRY_DIR: examples/registry

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/librarian
      - name: Render with every option enabled
        run: >
          helm template t deploy/helm/librarian
          --set publicUrl=https://librarian.example.com
          --set oauth2Proxy.enabled=true,oauth2Proxy.existingSecret=s,oauth2Proxy.approverGroup=g
          --set registry.gitSync.enabled=true,registry.gitSync.repo=https://example.com/r.git
          --set ingress.a2a.enabled=true,ingress.pages.enabled=true,otel.enabled=true
          > /dev/null
      - name: Numeric GitHub App ids from a values file render whole
        run: |
          out="$(helm template t deploy/helm/librarian -f deploy/helm/librarian/ci/github-app-values.yaml)"
          echo "$out" | grep -q -- "--github-app-installation-id=987654321," || { echo "$out" | grep installation-id; exit 1; }
          echo "$out" | grep -q -- "--github-app-application-id=1234567," || { echo "$out" | grep application-id; exit 1; }
          echo "$out" | grep -q 'app_id: "1234567"' || { echo "$out" | grep app_id; exit 1; }
      - name: Agents on Agent Substrate
        run: |
          out="$(helm template t deploy/helm/librarian -f deploy/helm/librarian/ci/substrate-values.yaml)"
          echo "$out" | grep -q 'kind: RemoteMCPServer' || { echo "no RemoteMCPServer"; exit 1; }
          echo "$out" | grep -q -- '- kagent-agent-info' || { echo "$out" | grep -A6 actorJwt; exit 1; }
          echo "$out" | grep -q 'url: http://t-librarian.default.svc.cluster.local:8080/mcp' || { echo "$out" | grep 'url:'; exit 1; }
          echo "$out" | grep -q 'ca_file: /var/run/librarian/substrate/ca.crt' || { echo "$out" | grep -A12 'substrate:'; exit 1; }
          echo "$out" | grep -q 'signerName: servicedns.podcert.ate.dev/identity' || { echo "no trust bundle volume"; exit 1; }
          plain="$(helm template t deploy/helm/librarian --set substrate.enabled=true,substrate.kagent.enabled=false)"
          if echo "$plain" | grep -q 'RemoteMCPServer\|kagent_url'; then echo "kagent rendered while off"; exit 1; fi
          if helm template t deploy/helm/librarian | grep -q 'substrate'; then echo "substrate rendered while off"; exit 1; fi
      - name: The kagent example registers the server its Agent names
        run: |
          # As the guide installs it: release and namespace `librarian`, with the
          # example's values. (That its files fit each other: tests/test_kagent_example.py.)
          out="$(helm template librarian deploy/helm/librarian --namespace librarian -f examples/kagent/values.yaml)"
          echo "$out" | grep -A3 'kind: RemoteMCPServer' | grep -q '  name: librarian$' || { echo "$out" | grep -A3 'kind: RemoteMCPServer'; exit 1; }
          echo "$out" | grep -A3 'kind: RemoteMCPServer' | grep -q '  namespace: librarian$' || { echo "$out" | grep -A3 'kind: RemoteMCPServer'; exit 1; }
          echo "$out" | grep -q 'url: http://librarian.librarian.svc.cluster.local:8080/mcp' || { echo "$out" | grep 'url:'; exit 1; }
          echo "$out" | grep -q 'registry_dir: /git/current/examples/quickstart/registry' || { echo "$out" | grep registry_dir; exit 1; }
          echo "$out" | grep -q 'name: librarian-demo' || { echo "no rule for the demo agent"; exit 1; }
      - name: Behind agentgateway
        run: |
          out="$(helm template t deploy/helm/librarian --set agentgateway.enabled=true,agentgateway.gateway.name=agents,agentgateway.gateway.namespace=gw)"
          echo "$out" | grep -q 'kind: HTTPRoute' || { echo "no HTTPRoute"; exit 1; }
          [ "$(echo "$out" | grep -c 'kind: AgentgatewayBackend')" -ge 2 ] || { echo "not two backends"; exit 1; }
          echo "$out" | grep -q 'host: t-librarian.default.svc' || { echo "$out" | grep 'host:'; exit 1; }
          echo "$out" | grep -q 'sessionRouting: Stateless' || { echo "MCP backend is not stateless"; exit 1; }
          echo "$out" | grep -A1 'parentRefs' | grep -q 'name: agents' || { echo "$out" | grep -A3 parentRefs; exit 1; }
          if helm template t deploy/helm/librarian --set agentgateway.enabled=true 2>/dev/null; then
            echo "agentgateway without a Gateway must be refused"; exit 1
          fi
          if helm template t deploy/helm/librarian | grep -q 'agentgateway'; then echo "agentgateway rendered while off"; exit 1; fi
      - name: The record needs no git-sync
        run: |
          out="$(helm template t deploy/helm/librarian -f deploy/helm/librarian/ci/record-only-values.yaml)"
          echo "$out" | grep -q 'repo: acme/api-registry' || { echo "$out" | grep -A8 publish; exit 1; }
          if echo "$out" | grep -q 'git-sync'; then echo "git-sync rendered without registry.gitSync"; exit 1; fi
          if helm template t deploy/helm/librarian --set githubApp.enabled=true,githubApp.appId=1,githubApp.installationId=2,githubApp.secretName=s 2>/dev/null; then
            echo "githubApp without a repo must be refused"; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t librarian:ci .
