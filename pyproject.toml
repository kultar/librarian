[project]
name = "librarian-a2a"
version = "0.13.1"
description = "An A2A agent that learns APIs on demand and gives other agents safe, audited access: reads within policy, writes with human approval."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "kultar", email = "kultar@kultar.net" }
]
requires-python = ">=3.12"
keywords = ["a2a", "agents", "api", "openapi", "llm", "pydantic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk[http-server,sqlite]>=1.2.2",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "opentelemetry-api>=1.33",
    "pydantic>=2.14.0",
    "pydantic-ai-slim[anthropic,openai]>=2.55.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
librarian = "librarian.cli:app"

[project.optional-dependencies]
postgres = [
    "a2a-sdk[postgresql]>=1.2.2",
]
aws = [
    "boto3>=1.35",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.33",
    "opentelemetry-instrumentation-asgi>=0.54b0",
    "opentelemetry-sdk>=1.33",
]

[project.urls]
Homepage = "https://librarian-agent.com"
Repository = "https://github.com/kultar/librarian"
Issues = "https://github.com/kultar/librarian/issues"
Security = "https://github.com/kultar/librarian/security/policy"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Published as `librarian-a2a` (the name `librarian` is taken on PyPI); the import
# package and the CLI are still `librarian`.
module-name = "librarian"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "opentelemetry-instrumentation-asgi>=0.54b0",
    "opentelemetry-sdk>=1.33",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC110"]
"tests/integration/**" = ["S101", "S105", "S106", "S603", "S607"]  # drives docker compose

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# The A2A SDK's protobuf types are only partially typed.
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
