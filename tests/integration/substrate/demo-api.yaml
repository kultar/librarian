# go-httpbin: a stand-in for an internal API with a write operation.
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-api, namespace: librarian}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-api}}
  template:
    metadata: {labels: {app: demo-api}}
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: demo-api, namespace: librarian}
spec:
  selector: {app: demo-api}
  ports: [{port: 8080, targetPort: 8080}]
