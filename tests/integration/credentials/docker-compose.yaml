# Credentials made for each call, against services that check them for real:
# Keycloak issues OAuth client-credentials tokens and accepts or refuses them; MinIO
# verifies AWS Signature Version 4 and issues the short-lived credentials of an assumed
# role. librarian shares Keycloak's network namespace, so the token endpoint is on
# localhost (the only place a token endpoint may be plain http). See ../README.md.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8280"
      KC_HOSTNAME: http://localhost:8280
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8280:8280"     # Keycloak
      - "18401:8080"    # librarian, for agents and for the approval pages
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 60

  # S3 with real signature checks (a wrong signature is refused) and STS AssumeRole.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: librarian-test
      MINIO_ROOT_PASSWORD: librarian-test-secret
    ports:
      - "19000:9000"    # for the test that a wrong signature is refused

  librarian:
    build: ../../..
    image: librarian:integration
    network_mode: service:keycloak
    depends_on:
      keycloak: {condition: service_healthy}
      minio: {condition: service_started}
    command: [serve, --config, /config/config.yaml]
    environment:
      LIBRARIAN_SECRET_LIBRARIAN_CALLERS_AGENT_A: key-a
      # The client secrets. They go to the token endpoint only, never to an API.
      LIBRARIAN_SECRET_IDP_CLIENT: reader-secret-0123456789
      LIBRARIAN_SECRET_IDP_WRONG_CLIENT: not-the-secret-0123456789
      LIBRARIAN_DATABASE_URL: ""
      # librarian's own AWS identity: in a cluster, the role of its pod.
      AWS_ACCESS_KEY_ID: librarian-test
      AWS_SECRET_ACCESS_KEY: librarian-test-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL_STS: http://minio:9000     # where a role is assumed
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./registry:/registry:ro
