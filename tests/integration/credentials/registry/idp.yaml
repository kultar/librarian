# Keycloak's own "who am I" endpoint: it answers only for a token it issued itself.
id: idp
name: Identity provider
description: The userinfo endpoint of a Keycloak realm, called with a client-credentials token.
base_url: http://localhost:8280/realms/lib/protocol/openid-connect
status: verified
auth:
  type: oauth2_client
  secret_ref: idp/client
  token_url: http://localhost:8280/realms/lib/protocol/openid-connect/token
  client_id: librarian-reader
  scopes: [openid]
operations:
  - {id: whoami, method: GET, path: /userinfo, access: read, summary: Who the token belongs to}
