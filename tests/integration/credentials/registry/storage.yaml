# S3 (MinIO). Reads are signed with librarian's own AWS identity; writes with the
# short-lived credentials of a role it assumes for this API.
id: storage
name: Storage
description: An S3 bucket API that verifies every request's signature.
base_url: http://minio:9000
status: verified
auth: {type: aws_sigv4, service: s3, region: us-east-1}
write_auth:
  type: aws_sigv4
  service: s3
  region: us-east-1
  role_arn: arn:aws:iam::123456789012:role/storage-writer
operations:
  - id: listObjects
    method: GET
    path: /{bucket}
    access: read
    parameters:
      - {name: bucket, in: path}
      - {name: list-type, in: query}
      - {name: prefix, in: query}
  - id: getObject
    method: GET
    path: /{bucket}/{key}
    access: read
    parameters: [{name: bucket, in: path}, {name: key, in: path, allow_slash: true}]
  - id: createBucket
    method: PUT
    path: /{bucket}
    access: write
    writable: true
    parameters: [{name: bucket, in: path}]
  - id: putObject
    method: PUT
    path: /{bucket}/{key}
    access: write
    writable: true
    accepts_body: true
    parameters: [{name: bucket, in: path}, {name: key, in: path, allow_slash: true}]
