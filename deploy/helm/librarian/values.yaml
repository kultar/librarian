# Default values for librarian.

image:
  repository: ghcr.io/kultar/librarian
  tag: ""                # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# More than one replica: state must be shared, so set Postgres (LIBRARIAN_DATABASE_URL or
# config.database_url) and config.secrets_backend: aws, and persistence.enabled: false
# (nothing per-pod is needed then). librarian refuses to start otherwise. With more than
# one replica the chart adds a PodDisruptionBudget and spreads pods across nodes.
replicaCount: 1

# URL where approvers' browsers reach the approval pages (used in Slack links), e.g.
# https://librarian.example.com. Usually the host of `ingress.pages`.
publicUrl: ""

# A2A endpoint advertised in the agent card. Defaults to the in-cluster Service URL; set it
# to the a2a ingress URL if agents connect from outside the cluster.
a2aUrl: ""

# librarian configuration (see examples/librarian.yaml). Listener settings, paths and the
# approver header names are managed by the chart; everything else is yours.
# Put secrets (Slack token, model key, GitHub token) in `envFrom`, not here.
config:
  notifier:
    type: log
  writes:
    approvers: requester_or_group
    # announce_auto: true   # post each automatically approved write to the channel (noisy)
    # announce_grants: false  # stop the channel post on each use of a standing grant
    # Longest an approver may make an "allow similar writes" grant last, in days.
    # null (default): no limit; approvers may choose "until revoked".
    max_grant_days: null
  callers: []

# Extra environment, e.g. secrets as LIBRARIAN_NOTIFIER__SLACK__BOT_TOKEN,
# LIBRARIAN_MODEL_API_KEY, LIBRARIAN_PUBLISH__TOKEN, or caller keys as
# LIBRARIAN_SECRET_LIBRARIAN_CALLERS_<AGENT>.
env: []
envFrom: []
#  - secretRef:
#      name: librarian-secrets

# librarian's own service account. It needs no Kubernetes RBAC (librarian never calls the
# Kubernetes API); it carries the IAM role for Secrets Manager (IRSA / Pod Identity).
serviceAccount:
  create: true
  name: ""
  annotations: {}          # e.g. eks.amazonaws.com/role-arn for Secrets Manager (IRSA)
  # No Kubernetes API token in the pod: nothing uses it. IRSA mounts its own AWS token.
  automountToken: false

# /data holds the SQLite database, file secrets and learned APIs when there is no
# Postgres. With Postgres and AWS secrets nothing needs it: disable it for several replicas.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

registry:
  # Optional: bring hand-written entries in from a git repo. git-sync pulls it and librarian
  # imports new files into its database, which is the registry (a file never overrules a
  # decision made in librarian). Not needed for the record that githubApp writes: librarian
  # does not read that back, so leave this off unless you keep hand-written entries in git.
  gitSync:
    enabled: false
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    repo: ""               # https://github.com/acme/api-registry.git
    ref: main
    path: registry         # directory inside the repo that holds <id>.yaml files
    period: 60s
    # Secret with git credentials (keys per git-sync docs, e.g. GITSYNC_USERNAME and
    # GITSYNC_PASSWORD for HTTPS) for private repos.
    credentialsSecret: ""
    resources: {}

# The external record. Approvals and every later decision are made in librarian's database;
# with this on, each one is also committed to a GitHub repository (one YAML file per API, one
# commit per decision, saying who decided), so the registry also lives outside the database.
# Nothing is read back from it. Create the App with `librarian github-app create --repo
# owner/name`; it prints these values. (git-sync, when enabled, reads its repo with the
# same App.)
githubApp:
  enabled: false
  repo: ""                  # owner/name of the record repository (default: registry.gitSync.repo)
  appId: ""                 # e.g. "123456" (quote them: YAML numbers this large render badly)
  installationId: ""        # e.g. "987654321"
  secretName: ""            # Secret holding the App's private key
  secretKey: private-key.pem

# Agents on Agent Substrate / kagent. Their sandboxes hold no credentials: the egress gateway
# puts a signed actor JWT into each request, and librarian accepts it in place of a per-agent
# key. Enabling this sets config.substrate, mounts the trust bundle librarian needs to fetch
# the issuer's keys, and (with kagent) registers librarian as a RemoteMCPServer that agents
# can list under their tools. See docs/integrations.md.
substrate:
  enabled: false
  # Substrate's actor JWT issuer: https://idp.<namespace of Substrate>.svc unless you set
  # `actorJWT.issuer` when installing Substrate.
  issuer: https://idp.ate-system.svc
  # What the tokens must be minted for. The RemoteMCPServer below asks for it.
  audience: librarian
  # The cluster's DNS domain. Sandboxes resolve only fully qualified names, so librarian is
  # registered as <service>.<namespace>.svc.<clusterDomain>.
  clusterDomain: cluster.local
  # The in-cluster issuer's certificate comes from a cluster signer, not a public CA: the
  # chart projects that signer's ClusterTrustBundle into the pod. Turn off for an issuer
  # served with a publicly trusted certificate.
  trustBundle:
    enabled: true
    signerName: servicedns.podcert.ate.dev/identity
    labelSelector:
      podcert.ate.dev/canarying: live
  kagent:
    # An actor is one agent session. With kagent, librarian asks its controller for the
    # Agent behind the actor, so rules, grants and the audit trail are about the Agent.
    # Off: plain Substrate, where rules match on `atespace` and `actor`.
    enabled: true
    url: http://kagent-controller.kagent.svc:8083
    # The header in which kagent's runtime names the signed-in user, when kagent is
    # installed with token propagation on: X-User-Id. Nothing signs it and it is set inside
    # the sandbox, so librarian only shows it to approvers and records it, as what the
    # agent's side says. Empty: ignored.
    claimedUserHeader: ""
    remoteMCPServer:
      create: true          # needs kagent's CRDs in the cluster
      name: librarian
      namespace: ""         # default: the release namespace (kagent must watch it)
      # Which namespaces' Agents may use it: All, or Same (only its own namespace).
      allowedNamespaces: All
      # kagent's default is 30s; a plain-language request may take up to
      # config.fetch_timeout_seconds (100).
      timeout: 120s
      tokenSeconds: 900     # lifetime of each injected token (300 to 3600)
  # What each agent may do. First match wins; an agent no rule matches is refused.
  # `namespace`, `name` (globs) and `labels` describe the kagent Agent.
  rules: []
  # - match: {namespace: payments}
  #   write_apis: [github]              # may ask for writes there; each still needs approval
  #   owner: payments-leads@example.com # approves them (no person is known through kagent)
  #   limits:                           # what they may do inside an API (see the README)
  #     github: {arguments: {owner: [acme], repo: ["payments-*"]}}
  # - match: {}                         # every other agent: reads and learning, no writes
  #   apis: ["*"]

# Behind agentgateway (agentgateway.dev). The chart attaches librarian to a Gateway you
# already run: an HTTPRoute, and two AgentgatewayBackends that tell the gateway what it is
# talking to (an MCP server at /mcp, an A2A agent on every other path). Agents then use the
# gateway's address, and the agent card names it. Needs the Gateway API and agentgateway's
# CRDs in the cluster. What the gateway adds (signing people in, rules, rate limits) is set
# on its side, with an AgentgatewayPolicy for this HTTPRoute. See docs/integrations.md.
agentgateway:
  enabled: false
  gateway:
    name: ""                # the Gateway to attach to (required)
    namespace: ""           # default: the release namespace. In another one, the Gateway's
                            # listener has to allow routes from here (allowedRoutes).
    sectionName: ""         # one listener of it (default: every listener that allows it)
  hostnames: []             # e.g. [librarian.example.com] (default: the listener's hosts)

# Sign-in for approvers. Runs oauth2-proxy as a sidecar in front of the approval pages
# (and the console at the pages host's root, for the approver group) and switches
# librarian to approvers.mode=trusted_header. Agents keep using the A2A
# port directly and never pass through the proxy.
oauth2Proxy:
  enabled: false
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  # Secret with OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
  existingSecret: ""
  provider: oidc
  oidcIssuerUrl: ""        # e.g. https://acme.okta.com
  emailDomains: ["*"]
  # Group (as sent by your identity provider) whose members may approve credential
  # requests and, depending on writes.approvers, writes.
  approverGroup: ""
  extraArgs: []
  resources: {}

service:
  type: ClusterIP
  a2aPort: 8080
  pagesPort: 8081

ingress:
  # For agents outside the cluster. In-cluster agents use the Service directly.
  a2a:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
  # For approvers' browsers (route this through your SSO: enable oauth2Proxy).
  pages:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

otel:
  enabled: false
  endpoint: ""             # e.g. http://otel-collector.observability:4318

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
# Startup parses the whole registry before the server binds; a large API's entry
# (GitHub: 1,242 operations, 1 MB) takes seconds, more on a throttled core. The startup
# probe allows up to 10 minutes before liveness applies. Each key takes Kubernetes
# probe fields; set `startup: null` to drop the startup probe.
probes:
  startup: {periodSeconds: 10, failureThreshold: 60}
  readiness: {periodSeconds: 10}
  liveness: {periodSeconds: 20, failureThreshold: 3}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
# Used as given; with more than one replica and none set, pods are spread across nodes.
topologySpreadConstraints: []

nodeSelector: {}
tolerations: []
affinity: {}
