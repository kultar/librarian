# Default values for librarian.

image:
  repository: ghcr.io/kultar/librarian
  tag: ""                # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# More than one replica: state must be shared, so set Postgres (LIBRARIAN_DATABASE_URL or
# config.database_url) and config.secrets_backend: aws, and persistence.enabled: false
# (nothing per-pod is needed then). librarian refuses to start otherwise. With more than
# one replica the chart adds a PodDisruptionBudget and spreads pods across nodes.
replicaCount: 1

# URL where approvers' browsers reach the approval pages (used in Slack links), e.g.
# https://librarian.example.com. Usually the host of `ingress.pages`.
publicUrl: ""

# A2A endpoint advertised in the agent card. Defaults to the in-cluster Service URL; set it
# to the a2a ingress URL if agents connect from outside the cluster.
a2aUrl: ""

# librarian configuration (see examples/librarian.yaml). Listener settings, paths and the
# approver header names are managed by the chart; everything else is yours.
# Put secrets (Slack token, model key, GitHub token) in `envFrom`, not here.
config:
  notifier:
    type: log
  writes:
    approvers: requester_or_group
    # announce_auto: true   # post each automatically approved write to the channel (noisy)
  callers: []

# Extra environment, e.g. secrets as LIBRARIAN_NOTIFIER__SLACK__BOT_TOKEN,
# LIBRARIAN_MODEL_API_KEY, LIBRARIAN_PUBLISH__TOKEN, or caller keys as
# LIBRARIAN_SECRET_LIBRARIAN_CALLERS_<AGENT>.
env: []
envFrom: []
#  - secretRef:
#      name: librarian-secrets

# librarian's own service account. It needs no Kubernetes RBAC (librarian never calls the
# Kubernetes API); it carries the IAM role for Secrets Manager (IRSA / Pod Identity).
serviceAccount:
  create: true
  name: ""
  annotations: {}          # e.g. eks.amazonaws.com/role-arn for Secrets Manager (IRSA)
  # No Kubernetes API token in the pod: nothing uses it. IRSA mounts its own AWS token.
  automountToken: false

# /data holds the SQLite database, file secrets and learned APIs when there is no
# Postgres. With Postgres and AWS secrets nothing needs it: disable it for several replicas.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

registry:
  # Keep the registry in a git repo you review by pull request; git-sync pulls merged
  # changes and librarian hot-reloads them.
  gitSync:
    enabled: false
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    repo: ""               # https://github.com/acme/api-registry.git
    ref: main
    path: registry         # directory inside the repo that holds <id>.yaml files
    period: 60s
    # Secret with git credentials (keys per git-sync docs, e.g. GITSYNC_USERNAME and
    # GITSYNC_PASSWORD for HTTPS) for private repos.
    credentialsSecret: ""
    resources: {}

# A GitHub App for the registry repo (create one with `librarian github-app create
# --repo owner/name`; it prints these values). git-sync reads the repo with it and
# librarian opens review pull requests with it. Needs registry.gitSync.
githubApp:
  enabled: false
  appId: ""                 # e.g. "123456" (quote them: YAML numbers this large render badly)
  installationId: ""        # e.g. "987654321"
  secretName: ""            # Secret holding the App's private key
  secretKey: private-key.pem

# Sign-in for approvers. Runs oauth2-proxy as a sidecar in front of the approval pages
# (and the console at the pages host's root, for the approver group) and switches
# librarian to approvers.mode=trusted_header. Agents keep using the A2A
# port directly and never pass through the proxy.
oauth2Proxy:
  enabled: false
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  # Secret with OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
  existingSecret: ""
  provider: oidc
  oidcIssuerUrl: ""        # e.g. https://acme.okta.com
  emailDomains: ["*"]
  # Group (as sent by your identity provider) whose members may approve credential
  # requests and, depending on writes.approvers, writes.
  approverGroup: ""
  extraArgs: []
  resources: {}

service:
  type: ClusterIP
  a2aPort: 8080
  pagesPort: 8081

ingress:
  # For agents outside the cluster. In-cluster agents use the Service directly.
  a2a:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
  # For approvers' browsers (route this through your SSO: enable oauth2Proxy).
  pages:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

otel:
  enabled: false
  endpoint: ""             # e.g. http://otel-collector.observability:4318

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
# Startup parses the whole registry before the server binds; a large API's entry
# (GitHub: 1,242 operations, 1 MB) takes seconds, more on a throttled core. The startup
# probe allows up to 10 minutes before liveness applies. Each key takes Kubernetes
# probe fields; set `startup: null` to drop the startup probe.
probes:
  startup: {periodSeconds: 10, failureThreshold: 60}
  readiness: {periodSeconds: 10}
  liveness: {periodSeconds: 20, failureThreshold: 3}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
# Used as given; with more than one replica and none set, pods are spread across nodes.
topologySpreadConstraints: []

nodeSelector: {}
tolerations: []
affinity: {}
