apiVersion: v1
kind: Service
metadata:
  name: {{ include "librarian.fullname" . }}
  labels:
    {{- include "librarian.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "librarian.selectorLabels" . | nindent 4 }}
  ports:
    - name: a2a
      port: {{ .Values.service.a2aPort }}
      targetPort: a2a
    # Approval pages for browsers: through the sign-in proxy when enabled.
    - name: pages
      port: {{ .Values.service.pagesPort }}
      targetPort: {{ if .Values.oauth2Proxy.enabled }}proxy{{ else }}pages{{ end }}
