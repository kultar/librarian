{{- range $kind := list "a2a" "pages" }}
{{- $ing := index $.Values.ingress $kind }}
{{- if $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "librarian.fullname" $ }}-{{ $kind }}
  labels:
    {{- include "librarian.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with $ing.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "librarian.fullname" $ }}
                port:
                  name: {{ $kind }}
{{- end }}
{{- end }}
