apiVersion: v1
kind: Pod
metadata:
  name: {{ include "librarian.fullname" . }}-test
  labels:
    {{- include "librarian.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: check
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      command: [sh, -c]
      args:
        - >-
          wget -qO- http://{{ include "librarian.fullname" . }}:{{ .Values.service.a2aPort }}/.well-known/agent-card.json
          | grep -q '"name": *"librarian"' && echo "agent card OK"
