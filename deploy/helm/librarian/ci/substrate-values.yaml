# Regression check (ci.yml): agents on Agent Substrate / kagent.
substrate:
  enabled: true
  rules:
    - match: {namespace: payments}
      write_apis: [github]
      owner: payments-leads@example.com
      limits:
        github:
          arguments: {owner: [acme], repo: ["payments-*"]}
          allow_without: [meta_get]
    - match: {}
replicaCount: 2
persistence:
  enabled: false
