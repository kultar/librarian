# Regression check (ci.yml): numeric GitHub App ids from a values FILE arrive as float64 and must
# render whole, not as 9.87654321e+08 (which crash-looped git-sync).
registry:
  gitSync:
    enabled: true
    repo: https://github.com/acme/api-registry.git
githubApp:
  enabled: true
  appId: 1234567
  installationId: 987654321
  secretName: librarian-github-app
replicaCount: 2
persistence:
  enabled: false
